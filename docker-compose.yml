version: "3.9"

services:

  postgres:
    image: postgres:16
    container_name: postgres-db
    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: Data_ops_test

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:latest
    container_name: redis-server
    restart: always

    ports:
      - "6379:6379"

  fastapi:
    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: fastapi-app

    depends_on:
      - postgres
      - redis
    env_file:
      - backend/.env

    ports:
      - "8000:8000"

  celery:
    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: celery-worker

    command: >
      celery
      -A backend.app.tasks.celery_app:celery
      worker
      --pool=solo
      -Q email
      -n email_worker@%h
      --loglevel=info

    depends_on:
      - postgres
      - redis

    env_file:
      - backend/.env

  flower:
    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: flower

    command: >
      celery
      -A backend.app.tasks.celery_app:celery
      flower
      --port=5555

    depends_on:
      - redis
      - celery

    env_file:
      - backend/.env

    ports:
      - "5555:5555"

volumes:

  postgres_data: